# Example policy for Postgres / Supabase MCP servers wrapped with
# `connect.py wrap --app postgres` (tools show as postgres.<tool>).
# Globs are `*.tool` so wrapping the Supabase server as --app supabase works too.
#
# Checked (tool names from source, not guesses):
#   - @supabase/mcp-server-supabase 0.13.0 (tag mcp-server-supabase-v0.13.0)
#     and github.com/supabase/mcp main @ 8a265089 (2026-10-06), which adds
#     notebooks behind features=notebooks (not in 0.13.0, not a default group)
#   - @modelcontextprotocol/server-postgres 0.6.2 (archived
#     modelcontextprotocol/servers-archived src/postgres; in-file version 0.1.0).
#     Only tool is query; input field is sql
#
# SQL on execute_sql / query is deny, then review, then allow. Regexes are
# case-insensitive (the matcher compiles with re.I) and search json.dumps of
# the call input, so newlines are \n and quotes are \". This is not a SQL
# parser: a leading comment, SHOW/TABLE, a semicolon inside a string literal,
# or anything we cannot prove is a single SELECT/WITH/EXPLAIN falls through
# to default review.
default: review
default_reason: Postgres / Supabase changes require approval

rules:
  # ---- SQL: never
  # DROP/TRUNCATE only as a statement's leading keyword (start of the SQL, or
  # after ;), so SELECT ... 'drop off' is not denied. ALTER TABLE ... DROP
  # COLUMN is not a leading DROP; it waits for a person via the ALTER review.
  - id: block-sql-drop-truncate
    action: deny
    reason: Dropping or truncating database objects is not allowed
    match:
      name: ["*.execute_sql", "*.query", "*.apply_migration"]
      input_regex: '"(query|sql)"\s*:\s*"(?:(?:\\[nrt]|\s)*(?:DROP|TRUNCATE)\b|(?:[^"\\]|\\.)*;(?:\\[nrt]|\s)*(?:DROP|TRUNCATE)\b)'

  # ---- SQL: a person decides
  # INSERT/UPDATE/DELETE and other writes or DDL. SELECT ... INTO, a
  # data-modifying CTE, and SELECT 1; DELETE ... hit this before the allow rule.
  # Keyword-in-identifier false positives (a table named lock) wait for a person.
  - id: review-sql-writes
    action: review
    reason: This SQL writes or changes the schema
    match:
      name: ["*.execute_sql", "*.query"]
      input_regex: '\b(insert|update|delete|merge|alter|create|grant|revoke|copy|call|do|into|replace|refresh|reindex|vacuum|lock|execute|prepare|import|load|listen|notify|checkpoint|discard|cluster)\b'

  # Side-effect functions that a SELECT can still run. This is a denylist of
  # well-known names, not exhaustive; anything not listed can still reach allow.
  - id: review-sql-side-effects
    action: review
    reason: This SQL calls a function that can change session, sequence, or server state
    match:
      name: ["*.execute_sql", "*.query"]
      input_regex: '\b(pg_terminate_backend|pg_cancel_backend|setval|nextval|set_config|lo_unlink|lo_import|lo_export|pg_drop_replication_slot|pg_reload_conf|dblink)'

  # ---- SQL: reads run
  # Whole JSON string is one statement starting with SELECT, WITH or EXPLAIN.
  # [^;"\\] so a JSON-escaped quote (backslash + quote) cannot close the string
  # early and hide a second statement after ;.
  - id: allow-sql-select
    action: allow
    reason: Read-only SQL
    match:
      name: ["*.execute_sql", "*.query"]
      input_regex: '"(query|sql)"\s*:\s*"(?:\\[nrt]|\s)*(SELECT|WITH|EXPLAIN)\b(?:[^;"\\]|\\.)*"'

  # ---- never allowed (named tools)
  # Current Supabase MCP has no delete_project; the glob is there so a later
  # server that adds one stays blocked. Resetting a branch is the closest
  # "reset the database" tool; there is no reset_database.
  - id: block-destructive-postgres
    action: deny
    reason: Deleting or pausing a project or branch, or resetting a branch, is not allowed
    match:
      name: ["*.delete_project", "*.delete_branch", "*.pause_project", "*.reset_branch"]

  # ---- changes: a person decides
  - id: review-postgres-schema-and-functions
    action: review
    reason: Applying a migration or deploying a function changes production
    match:
      name: ["*.apply_migration", "*.deploy_edge_function"]

  - id: review-postgres-create-and-branch
    action: review
    reason: Creating a project or branch, or merging or rebasing a branch, needs approval
    match:
      name: ["*.create_project", "*.create_branch", "*.merge_branch", "*.rebase_branch"]

  - id: review-postgres-cost-and-restore
    action: review
    reason: Confirming spend or restoring a project needs approval
    match:
      name: ["*.confirm_cost", "*.restore_project"]

  # create_edge_function_secret is registered only when the server sets
  # elicitation.secretCollection (0.13.0 and 8a265089). Storage tools exist in
  # both; they are off unless features=storage (documented, not a hidden flag).
  - id: review-postgres-secrets-and-storage
    action: review
    reason: Changing Edge Function secrets or storage config needs approval
    match:
      name: ["*.create_edge_function_secret", "*.update_storage_config"]

  # ---- looking is fine
  # No list_schemas tool: list_tables takes a schemas list. query_logs is
  # read-only ClickHouse against logs (field sql), not Postgres execute_sql;
  # get_logs stays registered but is hidden when query_logs is available.
  # get_publishable_keys returns anon/publishable keys, not service_role.
  # list_notebooks / get_notebook are not in 0.13.0; on later main they exist
  # only behind features=notebooks, which is not a default group, so omitted.
  - id: allow-postgres-reads
    action: allow
    reason: Read-only Postgres / Supabase operation
    match:
      name:
        - "*.list_tables"
        - "*.list_extensions"
        - "*.list_migrations"
        - "*.list_projects"
        - "*.list_organizations"
        - "*.list_edge_functions"
        - "*.list_branches"
        - "*.list_storage_buckets"
        - "*.get_project"
        - "*.get_organization"
        - "*.get_cost"
        - "*.get_logs"
        - "*.get_advisors"
        - "*.get_project_url"
        - "*.get_publishable_keys"
        - "*.get_edge_function"
        - "*.get_storage_config"
        - "*.query_logs"
        - "*.search_docs"
        - "*.generate_typescript_types"
